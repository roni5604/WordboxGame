<!doctype html>
<!-- מקור התמונה web/og-image.png (1200x630) - תצוגת השיתוף בוואטסאפ/פייסבוק.
     יצירה מחדש (מתיקיית הפרויקט):
       "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --headless=new \
         --user-data-dir=/tmp/og-chrome --hide-scrollbars --force-device-scale-factor=1 \
         --window-size=1200,630 --virtual-time-budget=6000 \
         --screenshot=web/og-image.png "file://$PWD/tool/og_image.html" -->
<html lang="he" dir="rtl"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@500;800;900&display=block" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1200px;height:630px;overflow:hidden}
body{font-family:'Heebo',sans-serif;background:radial-gradient(ellipse at 75% 30%,#4a2fa8 0%,#24207a 45%,#120f45 100%);position:relative;color:#fff}
.stars{position:absolute;inset:0;background-image:
radial-gradient(2px 2px at 8% 15%,#fff,transparent),radial-gradient(1.5px 1.5px at 22% 78%,#ffe9a8,transparent),
radial-gradient(2px 2px at 35% 12%,#fff,transparent),radial-gradient(1.5px 1.5px at 48% 88%,#fff,transparent),
radial-gradient(2.5px 2.5px at 58% 20%,#ffd36b,transparent),radial-gradient(1.5px 1.5px at 66% 70%,#fff,transparent),
radial-gradient(2px 2px at 92% 85%,#fff,transparent),radial-gradient(1.5px 1.5px at 4% 55%,#cfe3ff,transparent),
radial-gradient(2px 2px at 30% 45%,#fff,transparent),radial-gradient(1.5px 1.5px at 52% 52%,#ffe9a8,transparent),
radial-gradient(2px 2px at 14% 92%,#fff,transparent),radial-gradient(1.5px 1.5px at 42% 30%,#fff,transparent);opacity:.9}
.wrap{position:absolute;inset:0;display:flex;align-items:center;gap:64px;padding:0 72px}
.icon{width:420px;height:420px;border-radius:96px;flex:none;box-shadow:0 24px 60px rgba(0,0,0,.45),0 0 0 6px rgba(255,201,60,.35)}
.text{flex:1;display:flex;flex-direction:column;gap:26px}
h1{font-weight:900;font-size:104px;line-height:1.05;white-space:nowrap;color:#ffae3d;
-webkit-text-stroke:8px #fff;paint-order:stroke fill;filter:drop-shadow(0 7px 0 #b8461a) drop-shadow(0 16px 24px rgba(0,0,0,.45))}
.sub{font-weight:800;font-size:50px;line-height:1.15}
.tiles{display:flex;gap:14px;margin:4px 0}
.tile{width:84px;height:84px;border-radius:22px;display:grid;place-items:center;font-weight:900;font-size:56px;color:#d42a36;
-webkit-text-stroke:2px #fff;paint-order:stroke fill;box-shadow:0 7px 0 rgba(0,0,0,.25),inset 0 -5px 0 rgba(0,0,0,.08)}
.t1{background:#fcefdc}.t2{background:#f6d197}.t3{background:#f0b770}.t4{background:#cc4590}
.tag{font-weight:500;font-size:32px;line-height:1.3;color:#dcd6ff}
.pill{display:inline-flex;gap:12px;align-self:flex-start;font-weight:800;font-size:26px;background:rgba(255,255,255,.14);border:2px solid rgba(255,255,255,.25);padding:10px 24px;border-radius:999px}
</style></head><body>
<div class="stars"></div>
<div class="wrap">
  <img class="icon" src="../assets/icon/app_icon.png" alt="">
  <div class="text">
    <h1>מצא ת׳מילה</h1>
    <div class="sub">משחק המילים בעברית</div>
    <div class="tag">חברו אותיות, מצאו מילים<br>ואתגרו את החברים</div>
    <div class="pill"><span>iPhone</span><span>·</span><span>Android</span><span>·</span><span>דפדפן</span></div>
  </div>
</div>
</body></html>
