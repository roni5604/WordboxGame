<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for

    This is a placeholder for base href that will be replaced by the value of

  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="מצא ת׳מילה - משחק מילים בעברית בסגנון Boggle/Wordbox. חברו אותיות שכנות ומצאו מילים בלוח שגדל משלב לשלב. משחקו של רוני מיכאלי.">
  <meta name="author" content="רוני מיכאלי">
  <meta name="theme-color" content="#FF8A3D">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

  <!-- תצוגה מקדימה יפה כשמשתפים קישור בפייסבוק / וואטסאפ -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="מצא ת׳מילה">
  <meta property="og:title" content="מצא ת׳מילה - משחק המילים בעברית">
  <meta property="og:description" content="חברו אותיות, מצאו מילים, ואתגרו את החברים! משחק מילים בעברית לאייפון, אנדרואיד ובדפדפן.">
  <meta property="og:image" content="https://roni5604.github.io/WordboxGame/og-image.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:url" content="https://roni5604.github.io/WordboxGame/">
  <meta property="og:locale" content="he_IL">
  <meta name="twitter:card" content="summary_large_image">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="מצא ת׳מילה">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>מצא ת׳מילה</title>

  <!--
    אזור בטוח באייפון (notch / Dynamic Island / פס הבית):
    1. Flutter מחליף את תג ה-viewport בשלו (בלי viewport-fit=cover), אז
       מחזירים את ה-cover מיד כשהוא נוסף - כך הרקע של המשחק ממשיך עד הקצוות.
    2. #safe-area-probe מודד את env(safe-area-inset-*), והאפליקציה קוראת
       אותו (lib/core/platform/web_safe_area.dart) כדי שהתוכן יישב באזור הבטוח.
  -->
  <style>
    html, body { background: #FF8A3D; margin: 0; }

    /* מסך טעינה ב-HTML - מוצג מיד, עוד לפני ש-Flutter נטען, ותואם למסך
       הפתיחה של האפליקציה (lib/features/splash/splash_screen.dart). נעלם
       בעדינות ברגע ש-Flutter מצייר את הפריים הראשון. */
    #boot {
      position: fixed; inset: 0; z-index: 10;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      background: linear-gradient(170deg, #FF8A3D 0%, #FF5E7E 55%, #9B5CFF 100%);
      font-family: -apple-system, "Segoe UI", Heebo, Arial, sans-serif;
      color: #fff; direction: rtl;
      transition: opacity .45s ease;
    }
    #boot.hide { opacity: 0; pointer-events: none; }
    #boot .tiles { display: grid; grid-template-columns: repeat(3, 58px); gap: 10px;
      transform: perspective(600px) rotateX(28deg); margin-bottom: 26px; }
    #boot .tile { width: 58px; height: 58px; border-radius: 50%; background: #FFD9A0;
      display: flex; align-items: center; justify-content: center;
      font-size: 30px; font-weight: 900; color: #E23B4E;
      box-shadow: 0 6px 0 rgba(120,40,40,.18);
      animation: boot-drop .7s cubic-bezier(.34,1.56,.64,1) both; }
    #boot .tile.lit { background: #FFE27A; animation: boot-drop .7s cubic-bezier(.34,1.56,.64,1) both, boot-glow 1.6s ease-in-out infinite 1s; }
    #boot h1 { margin: 0; font-size: 44px; font-weight: 900; text-shadow: 0 5px 0 rgba(180,50,31,.9); }
    #boot p { margin: 4px 0 26px; font-weight: 700; opacity: .9; }
    #boot .bar { width: 62%; max-width: 280px; height: 10px; border-radius: 8px; overflow: hidden;
      background: rgba(0,0,0,.18); border: 1.5px solid rgba(255,255,255,.5); }
    #boot .bar i { display: block; height: 100%; width: 40%; border-radius: 8px;
      background: linear-gradient(90deg, #FFE27A, #FFB700); animation: boot-bar 1.3s ease-in-out infinite; }
    @keyframes boot-drop { from { transform: translateY(-80px); opacity: 0; } to { transform: none; opacity: 1; } }
    @keyframes boot-glow { 50% { transform: scale(1.08); box-shadow: 0 0 22px rgba(255,226,122,.9); } }
    @keyframes boot-bar { 0% { transform: translateX(160%); } 100% { transform: translateX(-260%); } }
    @media (prefers-reduced-motion: reduce) { #boot * { animation: none !important; } }
    /* צבע אזור השעה/הסוללה באייפון (Safari 26 ב-iOS ו-macOS).
       Safari 26 מתעלם מ-theme-color. לפי קוד המקור של WebKit
       (LocalFrameView::fixedContainerEdges) הוא צובע את האזור לפי אלמנט
       position:fixed שנמצא בראש הדף - בתנאי שהאלמנט:
         * גלוי: opacity 0 / visibility hidden / opacity < 0.1 נפסלים;
         * גבוה מ-10px ורחב לפחות 90% מהמסך;
         * בעל רקע בצבע אחיד.
       אחרת הוא נופל לרקע הדף, שנדגם מחדש רק בגלילה - וזה הבאג שראינו
       (הפס נשאר בצבע המסך הקודם עד שמזיזים את המסך).
       לכן: פס גלוי בגובה 14px (או גובה ה-notch באפליקציה שנוספה למסך הבית),
       בצבע העליון של כל מסך - אותו צבע כמו הרקע שמתחתיו, כך שהוא לא נראה.
       Flutter מזיז את התוכן מתחתיו (WebSafeArea), והאפליקציה מחליפה אותו
       באלמנט חדש בכל מעבר מסך - כך Safari מעדכן את הצבע מיד.
       מופעל רק בדפדפני אפל (המחלקה wb-tint נוספת בסקריפט למטה). */
    #top-tint, #top-tint-old {
      display: none;
      position: fixed; top: 0; left: 0; right: 0; width: 100%;
      height: max(14px, env(safe-area-inset-top, 0px));
      background-color: #FF8A3D;
      z-index: 2147483000; pointer-events: none;
    }
    .wb-tint #top-tint, .wb-tint #top-tint-old { display: block; }
    #safe-area-probe {
      position: fixed; top: 0; left: 0; width: 0; height: 0;
      visibility: hidden; pointer-events: none;
      padding-top: env(safe-area-inset-top, 0px);
      padding-right: env(safe-area-inset-right, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px);
      padding-left: env(safe-area-inset-left, 0px);
    }
  </style>
  <script>
    // דפדפני אפל (Safari / כל דפדפן באייפון ובאייפד) - שם צריך את #top-tint.
    (function () {
      var ua = navigator.userAgent || '';
      var iOS = /iPhone|iPad|iPod/.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
      var desktopSafari = /Safari\//.test(ua) && !/Chrome|Chromium|CriOS|FxiOS|EdgiOS|Edg\/|OPR\/|Android/.test(ua);
      if (iOS || desktopSafari) document.documentElement.classList.add('wb-tint');
    })();
  </script>
  <script>
    (function () {
      function ensureCover() {
        var metas = document.querySelectorAll('meta[name="viewport"]');
        for (var i = 0; i < metas.length; i++) {
          var c = metas[i].getAttribute('content') || '';
          if (c.indexOf('viewport-fit') === -1) {
            metas[i].setAttribute('content', c + ', viewport-fit=cover');
          }
        }
      }
      new MutationObserver(ensureCover).observe(document.head, { childList: true, subtree: true, attributes: true, attributeFilter: ['content'] });
      ensureCover();
    })();
  </script>
  <!--
    ניווט אחורה של הדפדפן (החלקה מהקצה באייפון / כפתור "אחורה"):
    * __wbPop: מתי היה הניווט האחרון של הדפדפן. כשהדפדפן כבר הנפיש את
      החזרה בעצמו, Flutter מחליף מסך מיד בלי אנימציה נוספת (בלי "קפיצה").
    * __wbGuard: באמצע משחק הניווט אחורה מבוטל (חוזרים קדימה לאותו מסך)
      ונשלח אירוע wb-back-blocked - המשחק פותח את תפריט ההשהיה.
    נרשם לפני ש-Flutter נטען, בשלב ה-capture, כדי לרוץ לפני המאזין שלו.
  -->
  <script>
    (function () {
      window.__wbPop = 0;
      window.__wbGuard = 0;
      var swallowNext = false;
      window.addEventListener('popstate', function (e) {
        if (swallowNext) { swallowNext = false; e.stopImmediatePropagation(); return; }
        if (window.__wbGuard > 0) {
          e.stopImmediatePropagation();
          swallowNext = true;
          history.go(1);
          window.dispatchEvent(new Event('wb-back-blocked'));
          return;
        }
        window.__wbPop = performance.now();
      }, true);
    })();
  </script>
  <link rel="manifest" href="manifest.json">

  <!--
    Ad Placement API למשחקי HTML5. הפונקציות חייבות להיות בדף לפני התג.
    את כתובת התג והמזהה מוסיף AdsWebGateway רק כשפרסומות פעילות,
    כדי שבילד release בלי חשבון AdSense לא יטען מודעות בדיקה.
  -->
  <style>
    /* שכבת Flutter מכסה את המסך. שכבת המודעה של Google צריכה להיות מעליה. */
    iframe[src*="doubleclick"],
    iframe[src*="googlesyndication"],
    iframe[id^="google_ads"],
    ins.adsbygoogle {
      z-index: 2147483646 !important;
    }
  </style>
  <script id="wordbox-ad-stub">
    window.adsbygoogle = window.adsbygoogle || [];
    var adBreak = adConfig = function (o) { adsbygoogle.push(o); };
    window.wordboxAds = {
      started: false,
      configure: function (onReady) {
        adConfig({
          preloadAdBreaks: 'on',
          sound: 'on',
          onReady: function () {
            try { onReady(); } catch (e) { console.error(e); }
          }
        });
      },
      showReward: function (onViewed, onDone) {
        window.wordboxAds.started = false;
        var viewed = false;
        adBreak({
          type: 'reward',
          name: 'reward',
          beforeReward: function (showAdFn) {
            window.wordboxAds.started = true;
            window.wordboxAds._coverGame(true);
            try { showAdFn(); } catch (e) { console.error(e); }
            window.wordboxAds._liftOverlays();
          },
          // Google דוחה את הבקשה בלי adDismissed, ולא קורא ל-adBreakDone.
          adDismissed: function () {},
          adViewed: function () {
            viewed = true;
            try { onViewed(); } catch (e) { console.error('[wordbox ads] viewed', e); }
          },
          adBreakDone: function (info) {
            window.wordboxAds._coverGame(false);
            var status = info && info.breakStatus ? String(info.breakStatus) : '';
            console.log('[wordbox ads] reward done', status);
            try { onDone({ breakStatus: status, viewed: viewed }); }
            catch (e) { console.error('[wordbox ads] reward callback', e); }
          }
        });
      },
      showNext: function (onDone) {
        window.wordboxAds.started = false;
        adBreak({
          type: 'next',
          name: 'next-level',
          beforeAd: function () {
            window.wordboxAds.started = true;
            window.wordboxAds._coverGame(true);
            window.wordboxAds._liftOverlays();
          },
          adBreakDone: function (info) {
            window.wordboxAds._coverGame(false);
            try { onDone(info || {}); } catch (e) { console.error(e); }
          }
        });
      },
      _coverGame: function (hide) {
        var view = document.querySelector('flutter-view');
        if (view) view.style.visibility = hide ? 'hidden' : 'visible';
      },
      _liftOverlays: function () {
        if (!document.body) return;
        var nodes = document.body.children;
        for (var i = 0; i < nodes.length; i++) {
          var node = nodes[i];
          if (node.tagName === 'FLUTTER-VIEW' || node.tagName === 'SCRIPT' || node.tagName === 'STYLE') continue;
          node.style.zIndex = '2147483646';
        }
      }
    };
  </script>
  <script id="wordbox-ad-loader" async crossorigin="anonymous"></script>
</head>
<body dir="rtl">
  <div id="safe-area-probe"></div>
  <div id="top-tint"></div>
  <div id="boot" aria-label="טוען את מצא ת׳מילה">
    <div class="tiles">
      <div class="tile lit" style="animation-delay:.05s">מ</div><div class="tile" style="animation-delay:.1s">צ</div><div class="tile" style="animation-delay:.15s">א</div>
      <div class="tile" style="animation-delay:.2s">ת</div><div class="tile lit" style="animation-delay:.25s">י</div><div class="tile lit" style="animation-delay:.3s">ל</div>
      <div class="tile" style="animation-delay:.35s">ש</div><div class="tile" style="animation-delay:.4s">ב</div><div class="tile lit" style="animation-delay:.45s">ה</div>
    </div>
    <h1>מצא ת׳מילה</h1>
    <p>משחקו של רוני מיכאלי</p>
    <div class="bar"><i></i></div>
  </div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var boot = document.getElementById('boot');
      if (!boot) return;
      boot.classList.add('hide');
      setTimeout(function () { boot.remove(); }, 600);
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
