name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# הרשאות מינימליות לטוקן של GitHub Actions - רק קריאת הקוד.
permissions:
  contents: read

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Static analysis
        # כל ממצא מוצג גם כהערה (annotation) על הקובץ והשורה ב-PR.
        run: |
          flutter analyze --no-pub > analyze.txt 2>&1 || status=$?
          cat analyze.txt
          dart analyze --format=machine 2>&1 \
            | awk -F'|' 'NF>=8 { lvl = ($1=="ERROR") ? "error" : "warning"; printf "::%s file=%s,line=%s,col=%s::%s (%s)\n", lvl, $4, $5, $6, $8, $3 }' \
            | sed "s#file=$GITHUB_WORKSPACE/#file=#" || true
          exit ${status:-0}

      - name: Run tests
        # בדיקות שנכשלו מופיעות גם כהערות (annotations) ב-PR.
        run: |
          flutter test --reporter expanded > test-output.txt 2>&1 || status=$?
          tail -n 200 test-output.txt
          grep -E "\[E\]|Expected:|Actual:|Which:|TimeoutException|Error:" test-output.txt \
            | head -n 30 | sed 's/^/::error::/' || true
          exit ${status:-0}

      - name: Build web (smoke test)
        run: flutter build web --release

  build-android:
    # מוודא שתצורת הבילד של אנדרואיד (חתימה, AdMob) מתקמפלת.
    # בלי android/key.properties הבילד נחתם במפתח debug - זה רק בדיקה.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Android App Bundle (release)
        run: flutter build appbundle --release --dart-define-from-file=config/release.example.json

  firestore-rules:
    # בודק את firestore.rules מול אמולטור Firestore: גם שהמשחק עובד וגם
    # שניסיונות תקיפה נחסמים (firestore-tests/rules.test.js).
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: firestore-tests
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: firestore-tests/package-lock.json

      - name: Install
        run: npm ci

      - name: Rules tests (Firestore emulator)
        run: npx firebase emulators:exec --only firestore --project demo-wordbox "npm test"
