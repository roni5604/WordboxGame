name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# הרשאות מינימליות לטוקן של GitHub Actions - רק קריאת הקוד.
permissions:
  contents: read

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.5'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Static analysis
        # כל ממצא מוצג גם כהערה (annotation) על הקובץ והשורה ב-PR.
        run: |
          flutter analyze --no-pub > analyze.txt 2>&1 || status=$?
          cat analyze.txt
          dart analyze --format=machine 2>&1 \
            | awk -F'|' 'NF>=8 { lvl = ($1=="ERROR") ? "error" : "warning"; printf "::%s file=%s,line=%s,col=%s::%s (%s)\n", lvl, $4, $5, $6, $8, $3 }' \
            | sed "s#file=$GITHUB_WORKSPACE/#file=#" || true
          exit ${status:-0}

      - name: Run tests
        # בדיקות שנכשלו מופיעות גם כהערות (annotations) ב-PR.
        run: |
          flutter test --machine > test-results.jsonl || status=$?
          python3 - <<'PY' || true
          import json
          tests, errors = {}, {}
          for line in open('test-results.jsonl', encoding='utf-8'):
              try:
                  e = json.loads(line)
              except ValueError:
                  continue
              if e.get('type') == 'testStart':
                  t = e['test']
                  tests[t.get('id')] = (t.get('name', ''), t.get('root_url') or t.get('url') or '', t.get('root_line') or t.get('line') or 1)
              elif e.get('type') == 'error':
                  errors.setdefault(e.get('testID'), []).append(e.get('error', '') + '\n' + e.get('stackTrace', ''))
          done_failed = []
          for line in open('test-results.jsonl', encoding='utf-8'):
              try:
                  e = json.loads(line)
              except ValueError:
                  continue
              if e.get('type') == 'testDone' and e.get('result') != 'success' and not e.get('hidden'):
                  done_failed.append(e.get('testID'))
          print(f'::notice::tests={len(tests)} with_errors={len(errors)} failed={len(done_failed)}')
          for tid in done_failed:
              if tid not in errors:
                  name, url, line = tests.get(tid, ('?', '', 1))
                  print(f'::error::FAILED {name} ({url})')
          for tid, msgs in errors.items():
              name, url, line = tests.get(tid, ('?', '', 1))
              path = url.split('/test/', 1)[-1] if '/test/' in url else url
              msg = (name + ': ' + ' | '.join(msgs)).replace('\n', ' ').replace('%', '%25')[:1800]
              print(f'::error file=test/{path},line={line}::{msg}')
          PY
          exit ${status:-0}

      - name: Build web (smoke test)
        run: flutter build web --release

  build-android:
    # מוודא שתצורת הבילד של אנדרואיד (חתימה, AdMob, Facebook) מתקמפלת.
    # בלי android/key.properties הבילד נחתם במפתח debug - זה רק בדיקה.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.5'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Android App Bundle (release)
        run: flutter build appbundle --release --dart-define-from-file=config/release.example.json

  firestore-rules:
    # בודק את firestore.rules מול אמולטור Firestore: גם שהמשחק עובד וגם
    # שניסיונות תקיפה נחסמים (firestore-tests/rules.test.js).
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: firestore-tests
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: firestore-tests/package-lock.json

      - name: Install
        run: npm ci

      - name: Rules tests (Firestore emulator)
        run: npx firebase emulators:exec --only firestore --project demo-wordbox "npm test"
