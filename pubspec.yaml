name: wordbox_hebrew
description: "Wordbox-IL - משחק מילים בעברית בהשראת Wordbox, בסגנון Boggle. iOS, Android ו-Web מקוד אחד."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management & navigation
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1

  # Local persistence
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.5
  shared_preferences: ^2.3.4

  # Design & animation
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.2
  confetti: ^0.8.0

  # Backend (scaffolded, disabled until configured - see docs/FIREBASE_SETUP.md)
  firebase_core: ^3.10.1
  firebase_auth: ^5.4.1
  cloud_firestore: ^5.6.2
  firebase_database: ^11.3.2

  # Utilities
  collection: ^1.19.1
  equatable: ^2.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/dictionaries/
    - assets/config/
