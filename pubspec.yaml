name: wordbox_hebrew
description: "מצא ת׳מילה - משחק מילים בעברית בהשראת Wordbox, בסגנון Boggle. משחקה של ליאן רודן. iOS, Android ו-Web מקוד אחד."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management & navigation
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1

  # Local persistence
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.5
  shared_preferences: ^2.3.4

  # Design & animation
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.2
  confetti: ^0.8.0

  # Backend (scaffolded, disabled until configured - see docs/FIREBASE_SETUP.md)
  firebase_core: ^3.10.1
  firebase_auth: ^5.4.1
  cloud_firestore: ^5.6.2
  firebase_database: ^11.3.2

  # Utilities
  collection: ^1.19.1
  equatable: ^2.0.7
  google_sign_in: ^7.2.0
  sign_in_with_apple: ^7.0.1
  crypto: ^3.0.7
  flutter_facebook_auth: ^7.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true

  assets:
    - assets/dictionaries/
    - assets/config/
    - assets/icon/
    - assets/mascot/
    - assets/avatar/

flutter_launcher_icons:
  android: true
  ios: true
  web:
    generate: true
    image_path: assets/icon/app_icon.png
    background_color: "#FF7A45"
    theme_color: "#FF7A45"
  image_path: assets/icon/app_icon.png
  min_sdk_android: 21
  adaptive_icon_background: "#FF7A45"
  adaptive_icon_foreground: assets/icon/app_icon_adaptive_fg.png
  remove_alpha_ios: true
