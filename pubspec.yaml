name: wordbox_hebrew
description: "מצא ת׳מילה - משחק מילים בעברית בהשראת Wordbox, בסגנון Boggle. משחקו של רוני מיכאלי. iOS, Android ו-Web מקוד אחד."
publish_to: 'none'

version: 1.1.0+2

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management & navigation
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1

  # Local persistence
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.5
  shared_preferences: ^2.3.4

  # Design & animation
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.2
  confetti: ^0.8.0

  # Backend (scaffolded, disabled until configured - see docs/FIREBASE_SETUP.md)
  firebase_core: ^3.10.1
  firebase_auth: ^5.4.1
  cloud_firestore: ^5.6.2
  # Analytics (GA4/BigQuery) - see lib/core/analytics/ and docs/ANALYTICS_EVENTS.md.
  # 11.6.0 is the last line compatible with firebase_core 3.x (12.x needs core 4.x).
  firebase_analytics: ^11.6.0
  # דיווח קריסות (iOS/Android בלבד) - ראו lib/core/analytics/crash_reporting.dart.
  # 4.3.x היא השורה התואמת ל-firebase_core 3.x.
  firebase_crashlytics: ^4.3.0

  # Utilities
  collection: ^1.19.1
  equatable: ^2.0.7
  google_sign_in: ^7.2.0
  sign_in_with_apple: ^7.0.1
  crypto: ^3.0.7
  # גרסת האפליקציה מ-pubspec בזמן ריצה (Analytics/Crashlytics).
  package_info_plus: ^9.0.1
  audioplayers: ^6.7.1
  in_app_purchase: ^3.2.3
  # שיתוף הישגים (פייסבוק/וואטסאפ/מערכת) והזמנות לחברים.
  url_launcher: ^6.3.1
  share_plus: ^10.1.4

  # פרסומות: AdMob ב-iOS/Android, Ad Placement API באתר.
  # 7.0.0 היא הגרסה התואמת ל-SDK של הפרויקט (כולל UMP, Native templates, Rewarded).
  google_mobile_ads: ^7.0.0
  app_tracking_transparency: ^2.0.7
  # הטמעת תג הפרסומת של Google בדף האתר (רק קומפילציית Web).
  web: ^1.1.0
  flutter_local_notifications: ^20.1.0
  timezone: ^0.10.1
  flutter_timezone: ^5.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_driver:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3
  fake_cloud_firestore: ^3.1.0
  firebase_auth_mocks: ^0.14.2

flutter:
  uses-material-design: true

  assets:
    - assets/dictionaries/
    - assets/config/
    - assets/boards/
    - assets/icon/
    - assets/mascot/
    - assets/avatar/
    - assets/audio/
    # גופן Heebo בתוך האפליקציה - עובד גם בלי אינטרנט (רישיון: OFL.txt).
    - assets/google_fonts/

flutter_launcher_icons:
  android: true
  ios: true
  web:
    generate: true
    image_path: assets/icon/app_icon.png
    background_color: "#FF7A45"
    theme_color: "#FF7A45"
  image_path: assets/icon/app_icon.png
  min_sdk_android: 21
  adaptive_icon_background: "#FF7A45"
  adaptive_icon_foreground: assets/icon/app_icon_adaptive_fg.png
  remove_alpha_ios: true
